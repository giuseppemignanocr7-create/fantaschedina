name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Un push successivo annulla la run precedente sullo stesso ramo:
# evita code di build inutili e feedback su artefatti già superati.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Sicurezza (segreti, dipendenze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks deve poter ispezionare TUTTA la history, non solo l'ultimo
          # commit: un segreto rimosso ieri è ancora un segreto esposto.
          fetch-depth: 0

      - name: Secret scanning (intera history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Solo le dipendenze di produzione: quelle di sviluppo non finiscono
      # nel bundle servito agli utenti.
      - name: Audit dipendenze frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit dipendenze functions
        working-directory: functions
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le functions servono anche al frontend: i test importano da
      # functions/src e firebase-functions è installato solo lì.
      - name: Install functions dependencies
        run: npm --prefix functions ci

      # Due programmi distinti: il build di produzione non compila i test,
      # che importano da functions/src. Vedi il commento in tsconfig.json.
      - name: Typecheck applicazione
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck test
        run: npx tsc --noEmit -p tsconfig.test.json

      # Zero tolleranza: un warning ignorato oggi è un warning permanente.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Unit tests con coverage
        run: npx vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Verifica budget bundle
        run: node scripts/check-bundle-size.mjs

  # Il job "frontend" installa anche le dipendenze delle functions, quindi non
  # rappresenta l'ambiente di Vercel, che esegue solo `npm ci` alla radice.
  # Questa differenza ha gia' lasciato passare un build rotto in produzione:
  # un test importava da functions/src e trascinava firebase-functions nel
  # programma di tsc. Qui il build gira isolato, esattamente come su Vercel.
  build-produzione:
    name: Build di produzione (ambiente Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (solo root, come Vercel)
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: placeholder
          VITE_FIREBASE_AUTH_DOMAIN: placeholder
          VITE_FIREBASE_PROJECT_ID: placeholder
          VITE_FIREBASE_STORAGE_BUCKET: placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: placeholder
          VITE_FIREBASE_APP_ID: placeholder

  functions:
    name: Cloud Functions (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # Le callable toccano soldi e stato: la logica pura ha i suoi unit test, ma
  # transazioni, idempotenza e interazione profilo/schedina si vedono solo
  # contro un Firestore vero. L'emulatore richiede Java, come per gli E2E.
  integrazione:
    name: Integrazione functions (emulatore Firestore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # I test importano da functions/src: firebase-admin e firebase-functions
      # sono installati solo li'.
      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Test di integrazione
        run: npm run test:integration

  e2e:
    name: E2E (Playwright + Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
